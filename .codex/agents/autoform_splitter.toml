name = "autoform_splitter"
description = "Splits one tier-1 cluster into its tier-2 nodes — one per definition or statement, a hard theorem into a few recomposing sub-statements — deciding each node's kind, parent, within-tier dependencies, and Mathlib-status guess, and writing the universal-voice prose for each. Returns structural data for the orchestrator to merge; writes only its content files."
