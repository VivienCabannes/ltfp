fidelity:
  divergences: 'No new source divergence. The Lean statements transcribe the
    reviewed tier-2 statements, whose own divergences are already recorded in
    their content files. Two conventions are worth restating: Mathlib''s
    trapezoidal_error is the estimator minus the integral, the opposite
    orientation to the book''s error, so both signed forms are recorded and the
    absolute errors agree; and where a source-facing statement is weaker than
    what its proof establishes, the general lemma and the exact source-facing
    statement are both recorded, with unconsumed source hypotheses kept and
    underscore-prefixed.'
review:
  status: unchecked
  reviewers: []
  notes: 'This status is the Lean proof jury, which has not run. The Phase 1
    planning graph was independently reviewed and is attested separately in
    sources/phase1_review_attestation.json; that graph review is not evidence
    of source-faithfulness, proof-integrity, or code-quality review of Lean
    declarations. The 2026-08-05 Lean modules did pass an automated review wave
    inside the session that wrote them: each module was checked by a separate
    reviewer agent, with no human reviewer, that recompiled the module, compared
    every statement against its frozen tier-2 specification hypothesis by
    hypothesis, audited #print axioms for every public declaration, and hunted
    for vacuity and statement drift. The wave reported no blocker and no major
    finding against the Lean code; its minor findings, and two false claims it
    found in the accompanying documentation, were applied. Its transcripts are
    not archived in this repository, so that report is not independently
    verifiable here, and it is not a substitute for the faithfulness,
    proof-integrity, and code-quality reviews required by the roadmap.'
