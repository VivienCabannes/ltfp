site_name: Learning Theory from First Principles in Lean
site_description: Autoform textbook blueprint and dependency maps
site_url: https://viviencabannes.github.io/ltfp/
repo_url: https://github.com/VivienCabannes/ltfp

# `autoform render` derives this tree from blueprint/. The Markdown vault is
# the source of truth; site-src/ is always regenerated.
docs_dir: site-src
site_dir: site
use_directory_urls: false

# Keep the primary navigation stable while Autoform derives the book chapters,
# progress report, and graph views from the Markdown vault.
nav:
  - Blueprint: README.md
  - Progress: progress.md
  - Dependencies: dependencies.md

theme:
  name: mkdocs
  # Autoform renders the book's reading order at the bottom of book pages.
  custom_dir: theme
  nav_style: light
  color_mode: auto
  user_color_mode_toggle: true

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - https://fonts.googleapis.com/css2?family=Merriweather:wght@400;500;700&family=Open+Sans:wght@400;600&family=Source+Code+Pro:wght@400;600&display=swap
  - stylesheets/blueprint.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - javascripts/blueprint-mermaid.js
